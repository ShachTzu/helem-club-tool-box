# Secret scan for the git mirror.
#
# Why this exists when GitHub secret scanning is already on: the built-in scan
# only knows *provider* token formats (Cloudinary, AWS, Stripe...). The secret
# that matters most here is MONGO_URL — a generic connection string, which the
# built-in scan does not see. GitHub's generic-pattern detection
# (secret_scanning_non_provider_patterns) needs a paid plan and silently stays
# disabled on this repo, so gitleaks covers that gap instead.
#
# This repo is PUBLIC (hopeAI reads it), so a leaked secret is public the moment
# it lands. Build and test are NOT here — Ripple CI on bit.cloud does that, and
# duplicating it would mean putting a bit.cloud token in GitHub secrets.
#
# ponytail: no license key needed — gitleaks-action is free for personal
# accounts. If this repo ever moves to a GitHub org, add GITLEAKS_LICENSE.

name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gitleaks scans history, not just the tip commit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
